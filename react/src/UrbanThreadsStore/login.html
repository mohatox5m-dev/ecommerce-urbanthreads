
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Urban Threads</title>
    <link rel="stylesheet" href="style.css">
    <!-- type="module" lets us use import for Firebase (use Live Server, not file://) -->
    <script type="module" src="login.js"></script>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            URBAN<span>THREADS</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <span id="nav-user" class="nav-user"></span>
            <a href="login.html" id="nav-login-link">Login</a>
            <button type="button" id="nav-logout-btn" class="nav-logout" hidden>
                Log out
            </button>
            <a href="admin.html" id="nav-admin-link">Admin</a>
            <a href="cart.html" id="nav-cart-link" hidden>
                Cart 🛒 (<span id="cart-count">0</span>)
            </a>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <p class="eyebrow">WELCOME TO THE MOVEMENT</p>
            <h1 id="form-title">Create your account</h1>
            <p id="form-description">
                Join Urban Threads and find your style.
            </p>

            <form id="auth-form">
                <div class="form-field" id="name-field">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your full name"
                        autocomplete="name"
                        minlength="2"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-field" id="role-field">
                    <label for="role">Account role</label>
                    <select id="role" name="role" required>
                        <option value="customer" selected>Customer — shop &amp; cart</option>
                        <option value="admin">Store admin — add products</option>
                    </select>
                </div>

                <p id="setup-hint" class="setup-hint">
                    First time? Paste Firebase keys in <strong>firebase-config.js</strong>
                    and open this page with <strong>Live Server</strong>.
                </p>

                <p id="auth-message" role="status" aria-live="polite"></p>

                <button type="submit" class="auth-button" id="submit-button">
                    Create Account
                </button>
            </form>

            <p class="auth-switch">
                <span id="switch-text">Already have an account?</span>
                <button type="button" id="switch-mode">
                    Log in
                </button>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Urban Threads. All rights reserved.</p>
    </footer>

</body>
</html>
