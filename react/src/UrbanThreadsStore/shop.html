
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Urban Threads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            URBAN<span>THREADS</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <span id="nav-user" class="nav-user"></span>
            <a href="login.html" id="nav-login-link">Login</a>
            <button type="button" id="nav-logout-btn" class="nav-logout" hidden>
                Log out
            </button>
            <a href="admin.html" id="nav-admin-link">Admin</a>
            <a href="cart.html" id="nav-cart-link" hidden>
                Cart 🛒 (<span id="cart-count">0</span>)
            </a>
        </nav>
    </header>

    <main class="shop-page">
        <section class="shop-heading">
            <p class="eyebrow">THE LATEST DROP</p>
            <h1>Shop Streetwear</h1>
            <p>Find your fit. Define your style.</p>
        </section>

        <section class="shop-controls">
            <label for="category-filter">Filter by category:</label>

            <select id="category-filter">
                <option value="All">All Products</option>
                <option value="Hoodies">Hoodies</option>
                <option value="T-shirts">T-shirts</option>
                <option value="Sneakers">Sneakers</option>
                <option value="Accessories">Accessories</option>
            </select>
        </section>

        <p id="product-message" role="status"></p>

        <section
            id="product-grid"
            class="product-grid"
            aria-label="Products"
        >
            <!-- JavaScript will insert product cards here -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Urban Threads. All rights reserved.</p>
    </footer>
    <script type="module" src="shop.js"></script>
</body>
</html>
