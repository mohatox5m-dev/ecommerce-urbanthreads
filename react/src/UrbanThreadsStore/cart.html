
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Urban Threads</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            URBAN<span>THREADS</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <span id="nav-user" class="nav-user"></span>
            <a href="login.html" id="nav-login-link">Login</a>
            <button type="button" id="nav-logout-btn" class="nav-logout" hidden>
                Log out
            </button>
            <a href="admin.html" id="nav-admin-link">Admin</a>
            <a href="cart.html" id="nav-cart-link" hidden>
                Cart 🛒 (<span id="cart-count">0</span>)
            </a>
        </nav>
    </header>

    <main class="cart-page">
        <section class="cart-heading">
            <p class="eyebrow">YOUR SELECTION</p>
            <h1>Your Shopping Cart</h1>
            <p>Review your items before checkout.</p>
        </section>

        <p id="cart-message" role="status" aria-live="polite"></p>

        <div class="cart-layout">
            <section id="cart-items" aria-label="Cart items">
                <!-- JavaScript will insert cart items here -->
            </section>

            <aside class="cart-summary">
                <h2>Order Summary</h2>

                <div class="summary-line">
                    <span>Items</span>
                    <span id="summary-quantity">0</span>
                </div>

                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">R0.00</span>
                </div>

                <div class="summary-line total-line">
                    <span>Total</span>
                    <span id="cart-total">R0.00</span>
                </div>

                <button id="checkout-button" class="auth-button">
                    Proceed to Checkout
                </button>

                <a href="shop.html" class="continue-shopping">
                    Continue Shopping
                </a>
            </aside>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Urban Threads. All rights reserved.</p>
    </footer>
    <script type="module" src="cart.js"></script>
</body>
</html>
